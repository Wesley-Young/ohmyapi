name: ohmyapi

services:
  app:
    image: ohmyapi:${OHMYAPI_IMAGE_TAG:?Set OHMYAPI_IMAGE_TAG to the image revision}
    build:
      context: ../..
      args:
        VCS_REF: ${OHMYAPI_IMAGE_TAG:?Set OHMYAPI_IMAGE_TAG to the image revision}
    env_file:
      - ./secrets/ohmyapi.env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "127.0.0.1:39999:8000"
    volumes:
      - type: bind
        source: ./config/endpoints.json
        target: /app/endpoints.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15m
    restart: unless-stopped

  db:
    image: postgres:15-bookworm
    env_file:
      - ./secrets/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
