name: ohmyapi

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ohmyapi
      POSTGRES_USER: ohmyapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohmyapi_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmyapi -d ohmyapi"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
